<!doctype html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المكتبة الرقمية للمصمم التعليمي</title>
<meta name="description" content="المكتبة الرقمية المهنية للمصمم التعليمي — الأدوات والتقنيات الرقمية">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4fb; --surface:#ffffff; --surface-2:#f7f6fc; --ink:#1d1b2e; --ink-2:#4d4a63; --muted:#8a87a0; --line:#e8e6f2;
  --pri:#4a3a91; --pri-2:#6a58c2; --pri-soft:#ece8fb; --on-pri:#ffffff;
  --green:#2f8a5b; --green-soft:#e3f4ea; --red:#c2413b; --red-soft:#fdecec;
  --peach:#fbf0dc; --lilac:#ece6fb; --mint:#e1f3ef; --mint-ink:#2e8a78; --peach-ink:#b77b25;
  --hero-a:#e9e5fa; --hero-b:#f7f5fd;
  --shadow:0 1px 2px rgba(40,30,90,.05),0 8px 24px rgba(40,30,90,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14131c; --surface:#1d1c28; --surface-2:#232232; --ink:#ecebf5; --ink-2:#c3c1d3; --muted:#8f8ca6; --line:#2f2d40;
    --pri:#9d8cf0; --pri-2:#b4a6f5; --pri-soft:#2b2747; --on-pri:#16131f;
    --green:#6fcf98; --green-soft:#1d3428; --red:#f08b85; --red-soft:#3a2224;
    --peach:#352c1e; --lilac:#2a2640; --mint:#1c3230; --mint-ink:#6fd0bd; --peach-ink:#e8b062;
    --hero-a:#211e36; --hero-b:#191824; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#14131c; --surface:#1d1c28; --surface-2:#232232; --ink:#ecebf5; --ink-2:#c3c1d3; --muted:#8f8ca6; --line:#2f2d40;
  --pri:#9d8cf0; --pri-2:#b4a6f5; --pri-soft:#2b2747; --on-pri:#16131f;
  --green:#6fcf98; --green-soft:#1d3428; --red:#f08b85; --red-soft:#3a2224;
  --peach:#352c1e; --lilac:#2a2640; --mint:#1c3230; --mint-ink:#6fd0bd; --peach-ink:#e8b062;
  --hero-a:#211e36; --hero-b:#191824; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.75;font-size:15px}
h1,h2,h3,.brand-t{font-family:"Cairo","IBM Plex Sans Arabic",sans-serif}
a{color:var(--pri)}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--pri-2);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:22px;height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-t{font-weight:800;font-size:17px;line-height:1.3}
nav.menu{display:flex;gap:4px}
nav.menu button{background:none;border:0;padding:8px 12px;font-size:15px;color:var(--ink-2);border-bottom:2px solid transparent}
nav.menu button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.hsearch{position:relative;margin-inline-start:auto;width:290px}
.hsearch input{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:9px 40px 9px 14px;font:inherit}
.hsearch .ico{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.sres{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none}
.sres.show{display:block}
.sres button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:8px;border-radius:8px;text-align:right}
.sres button:hover{background:var(--pri-soft)}
.sres small{color:var(--muted);display:block;font-size:12px;line-height:1.3}
.iconbtn{background:none;border:1px solid var(--line);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.burger{display:none}

/* hero */
.hero{background:linear-gradient(110deg,var(--hero-b) 0%,var(--hero-a) 60%,var(--hero-a) 100%);border-bottom:1px solid var(--line);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:24px;min-height:250px;padding-top:24px;padding-bottom:56px}
.hero h1{font-size:clamp(26px,3.4vw,40px);line-height:1.45;margin:0 0 10px;font-weight:800}
.hero p{margin:0;color:var(--ink-2);max-width:480px;font-size:16px}
.hero svg.art{width:100%;max-width:470px;height:auto;justify-self:start;display:block}

/* categories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-26px;position:relative}
.cat{border:0;border-radius:16px;padding:18px 18px 16px;text-align:right;display:flex;flex-direction:column;gap:6px;min-height:128px;box-shadow:var(--shadow);transition:transform .15s}
.cat:hover{transform:translateY(-3px)}
.cat .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cat b{font-family:"Cairo",sans-serif;font-size:16px;line-height:1.5}
.cat span.d{font-size:13px;opacity:.85}
.cat .go{margin-top:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.85);color:#222}
.cat .ico{width:34px;height:34px;stroke-width:1.5}
.cat.c1{background:var(--pri);color:var(--on-pri)}
.cat.c1 .go{background:rgba(255,255,255,.2);color:var(--on-pri)}
.cat.c2{background:var(--peach);color:var(--ink)} .cat.c2 .ico{color:var(--peach-ink)}
.cat.c3{background:var(--lilac);color:var(--ink)} .cat.c3 .ico{color:var(--pri)}
.cat.c4{background:var(--mint);color:var(--ink)} .cat.c4 .ico{color:var(--mint-ink)}
.cat .soon{font-size:11px;background:rgba(0,0,0,.06);border-radius:999px;padding:1px 8px;align-self:flex-start}
:root[data-theme="dark"] .cat .soon{background:rgba(255,255,255,.1)}

/* breadcrumb */
.crumb{display:flex;align-items:center;gap:8px;margin:26px 0 16px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--muted);font-size:14px}
.crumb b{color:var(--ink)}
.crumb .ico{width:16px;height:16px}

/* layout */
.layout>*,.inner>*,.two>*{min-width:0}
.layout{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start;padding-bottom:48px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.side{padding:16px;position:sticky;top:90px}
.side h3{margin:2px 6px 10px;font-size:16px}
.side .list{display:flex;flex-direction:column;gap:2px}
.tbtn{display:flex;align-items:center;gap:12px;background:none;border:0;padding:9px 10px;border-radius:12px;text-align:right;font-weight:600;font-size:15px;width:100%;direction:rtl}
.tbtn:hover{background:var(--surface-2)}
.tbtn.on{background:var(--pri-soft);color:var(--pri)}
.tbtn .en{direction:ltr}
.side hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
.tbtn.sm{font-weight:500;color:var(--ink-2);font-size:14px}
.tbtn.sm .ico{width:20px;height:20px;color:var(--pri)}
.mono{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-family:"Cairo",system-ui,sans-serif}
.mono.s{width:34px;height:34px;font-size:15px}
.mono.l{width:86px;height:86px;font-size:34px;box-shadow:0 8px 20px rgba(60,40,140,.25)}

.content{display:flex;flex-direction:column;gap:16px;min-width:0}
.head{display:flex;align-items:center;gap:18px;padding:20px 22px}
.head h2{margin:0;font-size:32px;line-height:1.2;direction:ltr;text-align:right;font-weight:800}
.head .sub{color:var(--ink-2);margin-top:4px}
.head .acts{margin-inline-start:auto;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.head .acts .row{display:flex;gap:8px}
.iconbtn.on{background:var(--pri-soft);color:var(--pri);border-color:var(--pri-soft)}
.pill{background:var(--peach);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill .st{color:#e0a21b}

.inner{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{padding:18px 20px}
.sec h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:17px}
.sec h3 .ico{color:var(--pri)}
.sec p{margin:0;color:var(--ink-2)}
.uses{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.use{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;font-size:14px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:8px;line-height:1.5}
.use .ico{width:34px;height:34px;color:var(--pri);stroke-width:1.5}
.feats{display:flex;flex-wrap:wrap;gap:8px}
.feat{background:var(--pri-soft);color:var(--pri);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 210px;gap:16px}
.plan{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;justify-items:start;border-radius:12px;padding:12px 14px;margin-top:8px}
.plan.free{background:var(--green-soft)}
.plan.paid{background:var(--pri-soft)}
.plan b{direction:ltr;white-space:nowrap}
.plan .tag{font-size:12px;border-radius:999px;padding:1px 10px;font-weight:700;color:#fff}
.plan.free .tag{background:var(--green)}
.plan.paid .tag{background:var(--pri)}
:root[data-theme="dark"] .plan .tag{color:#111}
.plan span.t{font-size:13px;color:var(--ink-2);line-height:1.7;grid-column:1/-1}
.langpill{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:600;margin-bottom:8px}
.lang p{font-size:13px}
.limits{background:var(--red-soft);border:1px solid transparent}
.limits h3 .ico{color:var(--red)}
.limits ul{margin:0;padding-inline-start:20px;color:var(--ink-2)}
.limits li::marker{color:var(--red)}
.access{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--pri);color:var(--on-pri);text-decoration:none;border-radius:12px;padding:13px;font-weight:700;font-size:16px}
.access:hover{background:var(--pri-2)}
.stamp{font-size:12px;color:var(--muted);text-align:center;margin-top:-6px}

/* rating */
.rate h3{margin:0 0 12px;font-size:17px}
.rate .lbl{font-weight:600;font-size:14px;margin:6px 0 4px}
.stars{display:flex;gap:4px;justify-content:center;direction:ltr;margin:4px 0 10px}
.star{background:none;border:0;padding:0;line-height:0;color:#e0a21b}
.star svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6}
.star.on svg{fill:currentColor}
.rate input,.rate textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:9px 12px;margin-bottom:8px;resize:vertical}
.send{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:var(--on-pri);border:0;border-radius:10px;padding:10px;font-weight:700}
.msg{font-size:13px;min-height:20px;color:var(--green);margin-top:6px}
.rate hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.review{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;flex:none}
.review b{display:block}
.review .when{font-size:12px;color:var(--muted)}
.review .rs{color:#e0a21b;letter-spacing:2px;font-size:13px}
.review p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.emptyrev{text-align:center;color:var(--muted);font-size:14px;padding:14px 6px;border:1px dashed var(--line);border-radius:12px}
.small{font-size:12px;color:var(--muted);margin-top:8px}

/* compare & picker */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
thead th{background:var(--surface-2);font-weight:700}
tbody tr:last-child td{border-bottom:0}
td.tn button{background:none;border:0;padding:0;color:var(--pri);font-weight:700;direction:ltr;text-decoration:underline}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.opt{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;text-align:right;font-size:15px}
.opt:hover{border-color:var(--pri)}
.opt[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft)}
.rec{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.rec .badge{font-size:12px;border-radius:999px;padding:1px 10px;background:var(--pri-soft);color:var(--pri);font-weight:700;margin-inline-start:6px}
.rec button{margin-inline-start:auto;background:none;border:1px solid var(--pri);color:var(--pri);border-radius:10px;padding:6px 14px;font-weight:600}

/* modal + toast */
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,15,40,.5)}
.dl-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.dl-h h3{margin:0;font-size:18px}
.dl-b{padding:18px 20px;color:var(--ink-2)}
.dl-b ol,.dl-b ul{padding-inline-start:20px;margin:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);background:var(--surface);padding:22px 0;color:var(--muted);font-size:13px;text-align:center}

/* responsive */
@media (max-width:1060px){
  .inner{grid-template-columns:1fr}
  .hsearch{width:220px}
}
@media (max-width:860px){
  nav.menu{display:none}
  nav.menu.open{display:flex;flex-direction:column;position:absolute;top:72px;right:0;left:0;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px}
  .burger{display:grid}
  .hsearch{width:auto;flex:1}
  .brand-t{font-size:14px}
  .hero .wrap{grid-template-columns:1fr;padding-top:26px;padding-bottom:40px}
  .hero svg.art{max-width:330px;justify-self:center}
  .cats{grid-template-columns:repeat(2,1fr)}
  .layout{grid-template-columns:1fr}
  .side{position:static;padding:12px}
  .side .list{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .tbtn{width:auto;white-space:nowrap;flex:none}
  .side hr,.side h3{display:none}
}
@media (max-width:560px){
  .top .wrap{gap:10px}
  .brand-t span{display:none}
  .head{flex-wrap:wrap;padding:16px}
  .head .acts{margin-inline-start:0;flex-direction:row-reverse;width:100%;justify-content:space-between;align-items:center}
  .mono.l{width:64px;height:64px;font-size:26px}
  .head h2{font-size:26px}
  .uses{grid-template-columns:1fr}
  .use{flex-direction:row;text-align:right}
  .use .ico{width:28px;height:28px}
  .two{grid-template-columns:1fr}
  .cat{min-height:116px;padding:14px}
  .cat b{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

};
let toastT; function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600)}
const STAR = '<svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4l-5.5 2.9 1-6.2L3 9.7l6.2-.9z"/></svg>';

/* ======================= الأقسام ======================= */
$("#cats").innerHTML = CATS.map((c,i)=>`
  <button type="button" class="cat c${i+1}" data-cat="${c.k}">
    <div class="row"><b>${c.t}</b>${ic(c.i)}</div>
    <span class="d">${c.d}</span>
    ${c.ready?"":'<span class="soon">قيد الإعداد</span>'}
    <span class="go">${ic("i-chev","ico","width:16px;height:16px;stroke-width:2.4")}</span>
  </button>`).join("");
document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{
  const c=CATS.find(x=>x.k===b.dataset.cat);
  if(c.ready){ go("tool/"+(current||"canva")); $("#crumb").scrollIntoView(); }
  else toast("قسم «"+c.t+"» قيد الإعداد، ويُضاف قريبًا.");
});

/* ======================= القائمة الجانبية ======================= */
$("#tlist").innerHTML = TOOLS.map(t=>`<button type="button" class="tbtn" data-tool="${t.id}">${mono(t,"s")}<span class="en">${t.name}</span></button>`).join("")
 + `<hr><button type="button" class="tbtn sm" data-page="picker">${ic("i-compass")}أي أداة تناسبني؟</button>
    <button type="button" class="tbtn sm" data-page="compare">${ic("i-table")}مقارنة الأدوات</button>`;
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>go("tool/"+b.dataset.tool));
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));

/* ======================= الصفحات ======================= */
let current=null;
function crumb(last){
  $("#crumb").innerHTML = `${ic("i-home","ico")}<button type="button" data-home>الرئيسية</button>${ic("i-chev","ico")}<button type="button" data-goto="tool/${current||"canva"}">الأدوات والتقنيات الرقمية</button>${last?ic("i-chev","ico")+"<b dir='auto'>"+esc(last)+"</b>":""}`;
  $("#crumb [data-goto]").onclick=e=>go(e.currentTarget.dataset.goto);
  $("#crumb [data-home]").onclick=goHome;
}
function setActive(key){document.querySelectorAll(".tbtn").forEach(b=>b.classList.toggle("on",b.dataset.tool===key||b.dataset.page===key))}

function toolPage(t){
  const bm = (store.get("bookmarks")||[]).includes(t.id);
  return `
  <div class="box head">
    ${mono(t,"l")}
    <div><h2>${t.name}</h2><div class="sub">${esc(t.cat)}</div></div>
    <div class="acts">
      <div class="row">
        <button type="button" class="iconbtn" id="shareBtn" aria-label="مشاركة رابط الأداة">${ic("i-share","ico","width:18px;height:18px")}</button>
        <button type="button" class="iconbtn ${bm?"on":""}" id="bmBtn" aria-pressed="${bm}" aria-label="حفظ في المفضلة">${ic("i-bookmark","ico","width:18px;height:18px")}</button>
      </div>
      <span class="pill"><span class="st">★</span> لا توجد تقييمات بعد</span>
    </div>
  </div>
  <div class="inner">
    <div class="col">
      <div class="box sec"><h3>${ic("i-info")}نبذة تعريفية</h3><p>${esc(t.about)}</p></div>
      <div class="box sec"><h3>${ic("i-target")}أبرز الاستخدامات للمصمم التعليمي</h3>
        <div class="uses">${t.uses.map(([i,u])=>`<div class="use">${ic(i)}<span>${esc(u)}</span></div>`).join("")}</div></div>
      <div class="box sec"><h3>${ic("i-puzzle")}المكونات والميزات الرئيسية</h3>
        <div class="feats">${t.features.map(f=>`<span class="feat">${esc(f)}</span>`).join("")}</div></div>
      <div class="two">
        <div class="box sec"><h3>${ic("i-stack")}الإتاحة والاشتراك</h3>
          ${t.plans.map(([k,n,d])=>`<div class="plan ${k}"><b dir="auto">${esc(n)}</b><span class="tag">${k==="free"?"مجانية":"مدفوعة"}</span><span class="t">${esc(d)}</span></div>`).join("")}</div>
        <div class="box sec lang"><h3>${ic("i-globe")}اللغة</h3><span class="langpill">${esc(t.langShort)}</span><p>${esc(t.lang)}</p></div>
      </div>
      <div class="box sec limits"><h3>${ic("i-alert")}أبرز القيود</h3><ul>${t.limits.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>
      <a class="access" href="${t.url}" target="_blank" rel="noopener">${ic("i-ext")}الوصول إلى الأداة</a>
      <div class="stamp">آخر مراجعة للبيانات: يُحدد عند التحقق النهائي من الموقع الرسمي.</div>
    </div>
    <div class="box sec rate" id="rate"></div>
  </div>`;
}
function rateBox(t){
  const mine=store.get("rate-"+t.id);
  $("#rate").innerHTML = `
    <h3>تقييم المستخدمين</h3>
    <div class="lbl">قيّم تجربتك مع الأداة</div>
    <div class="stars" role="radiogroup" aria-label="التقييم من 5">${[1,2,3,4,5].map(v=>`<button type="button" class="star" data-v="${v}" aria-label="${v} من 5">${STAR}</button>`).join("")}</div>
    <input id="rName" maxlength="60" placeholder="اسمك (اختياري)" value="${mine?esc(mine.name):""}">
    <textarea id="rText" rows="3" maxlength="400" placeholder="اكتب ملاحظتك أو تجربتك…">${mine?esc(mine.text):""}</textarea>
    <button type="button" class="send" id="rSave">${ic("i-send","ico","width:18px;height:18px")}إرسال التقييم</button>
    <div class="msg" id="rMsg" aria-live="polite"></div>
    <hr>
    <h3 style="display:flex;gap:8px;align-items:center">${ic("i-chat","ico","color:var(--pri)")}آراء المستخدمين</h3>
    ${mine?`<div class="review"><div class="avatar">${ic("i-user","ico","width:20px;height:20px")}</div><div><b>${esc(mine.name||"تقييمك")}</b><span class="when">تقييمك المحفوظ</span><div class="rs">${"★".repeat(mine.v)}${"☆".repeat(5-mine.v)}</div>${mine.text?`<p>${esc(mine.text)}</p>`:""}</div></div>`
          :`<div class="emptyrev">لم تُضف آراء بعد.<br>يُستكمل بعد مشاركة المستخدمين.</div>`}
    <div class="small">يُحفظ تقييمك في متصفحك فقط، ولا يظهر لبقية الزوار.</div>`;
  let v=mine?mine.v:0;
  const stars=[...document.querySelectorAll("#rate .star")];
  const paint=n=>stars.forEach(s=>s.classList.toggle("on",+s.dataset.v<=n));
  paint(v);
  stars.forEach(s=>{s.onclick=()=>{v=+s.dataset.v;paint(v)};s.onmouseenter=()=>paint(+s.dataset.v);s.onmouseleave=()=>paint(v)});
  $("#rSave").onclick=()=>{
    if(!v){$("#rMsg").style.color="var(--red)";$("#rMsg").textContent="اختر عدد النجوم أولًا.";return}
    if(store.set("rate-"+t.id,{v,name:$("#rName").value.trim(),text:$("#rText").value.trim()})){rateBox(t);$("#rMsg").textContent="تم حفظ تقييمك، شكرًا لك."}
    else{$("#rMsg").style.color="var(--red)";$("#rMsg").textContent="تعذّر الحفظ في هذا المتصفح."}
  };
}
function showTool(id){
  const t=byId(id)||TOOLS[0]; current=t.id;
  $("#view").innerHTML=toolPage(t); rateBox(t); crumb(t.name); setActive(t.id);
  $("#shareBtn").onclick=async()=>{
    const url=location.href;
    try{ if(navigator.share){await navigator.share({title:t.name,url});return} await navigator.clipboard.writeText(url); toast("تم نسخ رابط الأداة"); }
    catch(e){ toast("رابط الأداة: "+url) }
  };
  $("#bmBtn").onclick=e=>{
    let l=store.get("bookmarks")||[]; const on=l.includes(t.id);
    l = on? l.filter(x=>x!==t.id) : [...l,t.id]; store.set("bookmarks",l);
    e.currentTarget.classList.toggle("on",!on); e.currentTarget.setAttribute("aria-pressed",!on);
    toast(on?"أُزيلت من المفضلة":"أُضيفت إلى المفضلة");
  };
}
function showCompare(){
  crumb("مقارنة الأدوات"); setActive("compare");
  $("#view").innerHTML=`<div class="box sec"><h3>${ic("i-table")}مقارنة الأدوات الخمس</h3>
   <div class="table-wrap"><table><thead><tr><th>الأداة</th><th>التصنيف</th><th>خطة مجانية</th><th>مفتوحة المصدر</th><th>اللغة ودعم العربية</th><th>أبرز القيود</th></tr></thead><tbody>
   ${TOOLS.map(t=>`<tr><td class="tn"><button type="button" data-t="${t.id}">${t.name}</button></td><td>${esc(t.cat)}</td>
     <td>${t.fully?"مجاني بالكامل":"نعم + خطة مدفوعة"}</td><td>${t.open?"نعم":"لا"}</td><td>${esc(t.arabicCmp)}</td><td>${esc(t.limits[0])}</td></tr>`).join("")}
   </tbody></table></div></div>`;
  document.querySelectorAll("#view [data-t]").forEach(b=>b.onclick=()=>go("tool/"+b.dataset.t));
}
function showPicker(){
  crumb("أي أداة تناسبني؟"); setActive("picker");
  $("#view").innerHTML=`<div class="box sec"><h3>${ic("i-compass")}أي أداة تناسب مهمتك؟</h3>
    <p style="margin-bottom:14px">اختر ما تريد إنجازه، وسنقترح عليك الأداة الأنسب من المكتبة.</p>
    <div class="opts">${PICKS.map((p,i)=>`<button type="button" class="opt" data-i="${i}" aria-pressed="false">${esc(p.t)}</button>`).join("")}</div>
    <div id="res" aria-live="polite" style="margin-top:16px"></div></div>`;
  document.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    document.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===o));
    const p=PICKS[+o.dataset.i];
    $("#res").innerHTML=`<p>${esc(p.why)}</p>`+p.ids.map((id,j)=>{const t=byId(id);return `<div class="rec">${mono(t,"s")}<div><b dir="ltr">${t.name}</b><span class="badge">${j?"بديل":"الاقتراح الأول"}</span><br><span class="small">${esc(t.cat)}</span></div><button type="button" data-t="${id}">عرض الأداة</button></div>`}).join("");
    document.querySelectorAll("#res [data-t]").forEach(b=>b.onclick=()=>go("tool/"+b.dataset.t));
  });
}

/* ======================= التنقل ======================= */
function go(h){ if(location.hash!=="#"+h) location.hash=h; else route(); }
function route(){
  const h=location.hash.slice(1);
  if(h.startsWith("tool/")) showTool(h.slice(5));
  else if(h==="compare") showCompare();
  else if(h==="picker") showPicker();
  else showTool(current||"canva");
  document.querySelectorAll("nav.menu button").forEach(b=>b.classList.toggle("on", h ? b.dataset.nav==="tools" : b.hasAttribute("data-home")));
  if(h && window.scrollY < 200) $("#crumb").scrollIntoView();
}
function goHome(){ history.pushState("",document.title,location.pathname); route(); window.scrollTo(0,0); }
window.addEventListener("hashchange",route);
document.querySelectorAll("[data-home]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();goHome();$("#menu").classList.remove("open")}));
document.querySelector('[data-nav="tools"]').onclick=()=>{go("tool/"+(current||"canva"));$("#menu").classList.remove("open")};
$("#burger").onclick=()=>$("#menu").classList.toggle("open");
route();

/* ======================= البحث ======================= */
const norm = s => s.toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");
const q=$("#q"), sres=$("#sres");
q.oninput=()=>{
  const v=norm(q.value.trim());
  if(!v){sres.classList.remove("show");return}
  const hits=TOOLS.filter(t=>norm([t.name,t.cat,t.about,t.uses.map(u=>u[1]).join(" "),t.features.join(" "),t.kw].join(" ")).includes(v));
  sres.innerHTML = hits.length? hits.map(t=>`<button type="button" data-t="${t.id}">${mono(t,"s")}<span><b dir="ltr">${t.name}</b><small>${esc(t.cat)}</small></span></button>`).join("")
                              : `<div style="padding:10px;color:var(--muted);font-size:14px">لا توجد نتائج مطابقة.</div>`;
  sres.classList.add("show");
  sres.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{go("tool/"+b.dataset.t);q.value="";sres.classList.remove("show")});
};
q.onkeydown=e=>{if(e.key==="Enter"){const f=sres.querySelector("[data-t]");if(f)f.click()} if(e.key==="Escape")sres.classList.remove("show")};
document.addEventListener("click",e=>{if(!e.target.closest(".hsearch"))sres.classList.remove("show")});

/* ======================= النوافذ ======================= */
const DLG={
  about:["عن المشروع",`<p>المكتبة الرقمية المهنية للمصمم التعليمي مشروع يجمع في مكان واحد ما يحتاجه المصمم التعليمي لتطوير ممارسته المهنية، وتتكون من أربع مواد:</p><ul style="margin-top:8px">${CATS.map(c=>`<li>${c.t}${c.ready?"":" (قيد الإعداد)"}</li>`).join("")}</ul><p style="margin-top:10px">تعرض مادة الأدوات والتقنيات الرقمية بطاقات موحدة لخمس أدوات؛ تُوثَّق الأسعار وفترات التجربة ولغات الواجهة من المواقع الرسمية عند النشر النهائي، ولا تُدرج تقييمات المستفيدين إلا بعد جمعها فعليًا.</p>`],
  help:["المساعدة",`<ol><li>اختر المادة من البطاقات أعلى الصفحة.</li><li>تنقّل بين الأدوات من القائمة الجانبية، أو ابحث عن أداة أو استخدام من شريط البحث.</li><li>استخدم «أي أداة تناسبني؟» لاقتراح أداة حسب مهمتك، و«مقارنة الأدوات» لرؤيتها جنبًا إلى جنب.</li><li>اضغط «الوصول إلى الأداة» لفتح موقعها الرسمي، وشارك تقييمك من خانة تقييم المستخدمين.</li></ol>`]
};
document.querySelectorAll("[data-dlg]").forEach(b=>b.onclick=()=>{
  const [h,body]=DLG[b.dataset.dlg]; const d=$("#dlg");
  d.innerHTML=`<div class="dl-h"><h3>${h}</h3><button type="button" class="iconbtn" aria-label="إغلاق">${ic("i-x","ico","width:18px;height:18px")}</button></div><div class="dl-b">${body}</div>`;
  d.querySelector("button").onclick=()=>d.close(); d.showModal(); $("#menu").classList.remove("open");
});
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});

/* ======================= الوضع الليلي ======================= */
const root=document.documentElement, th=store.get("theme"); if(th) root.dataset.theme=th;
$("#themeBtn").onclick=()=>{
  const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme=dark?"light":"dark"; store.set("theme",root.dataset.theme);
};
</script>
</body>
</html>
